{{define "index.html"}}
<!doctype html>
<html lang="en">
  <head>
    <title>DBT docs by nada</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
    <link rel="icon" sizes="32x32" href="/assets/img/dbt.ico">
    <link
      rel="preload"
      href="https://cdn.nav.no/aksel/fonts/SourceSans3-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
      />
    <link rel="stylesheet" href="/assets/css/main.css"/>
  </head>
  <body class="w-full flex flex-col items-center min-h-screen bg-[linear-gradient(to_left,#ffaa33,#ad0000)]">
    <header class="w-full bg-[#00374F] flex justify-center">
      <div class="max-w-2xl grow flex justify-between py-2 text-white">
        <a href="/" class="flex gap-2 items-center">
          <img class="hover:animate-spin w-12 h-12" src="/assets/img/dbt.png"/>
          <h1 class="text-2xl font-bold">DBT docs</h1>
          <span>by nada</span>
        </a>
      </div>
    </header>


    <div class="max-w-screen-md flex my-8 grow">
      <section class="w-full md:w-[64rem] flex flex-col gap-4 p-4">

        <article class="bg-white rounded-md p-4">
          <div class="flex flex-col gap-4">
            {{range $team, $docs := .dbtDocs}}
            <h2 class="aksel-heading aksel-heading--medium">{{$team}}</h2>
            <ul class="list-disc ml-4">
              {{range $doc := $docs}}
              <li>
                <a class="aksel-link" href="/docs/{{$team}}/{{$doc}}">{{$doc}}</a>
              </li>
              {{end}}
            </ul>
            {{end}}
          </div>
        </article>

        <article class="bg-white rounded-md p-4">
          <div class="flex flex-col gap-4">
            <p>
              Ta en titt på <a class="aksel-link" href="https://github.com/navikt/dbt-docs#publisering">navikt/dbt-docs</a> for publisering av dokumentasjon.
            </p>
          </div>
        </article>

      </section>
    </div>

    <footer class="mb-8 flex divide-x-2 divide-ax-border-neutral-subtleA divide-solid">
      <p class="px-2">&copy; NADA. All documentation servered</p>
    </footer>
  </body>
</html>
{{end}}
